# Check compatibility against the real Protocol 28 fixture pack published
# in StellarCanary/ProtocolCanary-Fixtures, against a live Testnet RPC
# endpoint. Not every project needs every compatibility surface — a
# project with no Soroban contracts, for example, can set
# `[tests] soroban = false` in its own .stellar-canary.toml and this
# workflow does not need to change.
name: Stellar Compatibility (Protocol 28)

on:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Protocol 28 fixtures
        uses: actions/checkout@v4
        with:
          repository: StellarCanary/ProtocolCanary-Fixtures
          # protocol-28 is the actual tag in ProtocolCanary-Fixtures (there
          # is no v0.1.0 there). Pin to it so a new pack for a future
          # protocol cannot change what this example checks against.
          ref: protocol-28
          path: canary-fixtures

      - name: Stellar Protocol Canary
        # The `id` is what makes a step's outputs addressable: downstream
        # steps read them as `steps.canary.outputs.<name>`.
        id: canary
        uses: StellarCanary/ProtocolCanary-Action@v1
        with:
          protocol: "28"
          fixtures-dir: canary-fixtures/protocol-28
          network: testnet
          rpc-url: https://soroban-testnet.stellar.org

      # Read the verdict from the outputs rather than from the console log.
      # Pass them through `env:` instead of interpolating them into the shell
      # script. `status` is always set (`pass`, `warning`, `fail`, `error`, or
      # `execution-failed`); `report` is an absolute path that is empty when
      # Canary produced no parsable report, so check `status` first. The Action
      # has no `exit-code` output — that one belongs to the reusable workflow
      # in .github/workflows/reusable-canary-check.yml.
      - name: Check canary verdict
        env:
          CANARY_STATUS: ${{ steps.canary.outputs.status }}
          CANARY_REPORT: ${{ steps.canary.outputs.report }}
          CANARY_SKIPPED: ${{ steps.canary.outputs.skipped }}
        run: |
          set -euo pipefail
          echo "canary status: $CANARY_STATUS (skipped checks: $CANARY_SKIPPED)"
          if [ -n "$CANARY_REPORT" ]; then
            echo "report: $CANARY_REPORT"
          fi
          test "$CANARY_STATUS" = pass

      # Gate a promotion on coverage as well as on the verdict: `pass` with
      # `coverage-state: partial` means some fixtures were skipped, and `none`
      # means nothing ran at all.
      - name: Publish compatibility evidence
        if: steps.canary.outputs.status == 'pass' && steps.canary.outputs.coverage-state == 'full'
        run: echo "Protocol 28 evidence verified."
